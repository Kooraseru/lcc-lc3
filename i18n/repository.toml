[title.values]
en-US = "LCC-LC3 C Compiler"
ja-JP = "LCC-LC3 C コンパイラ"
[summary.values]
en-US = "LCC-LC3 is an LC-3 target for the LCC C compiler. Build it from source on a Unix shell. Windows users should use WSL."
ja-JP = "LCC-LC3 は LCC C コンパイラ用の LC-3 ターゲットです。Unix シェルでソースからビルドします。Windows では WSL を使用してください。"
[navigation.setup.values]
en-US = "Set Up"
ja-JP = "セットアップ"
[navigation.source.values]
en-US = "Download"
ja-JP = "ダウンロード"
[navigation.install.values]
en-US = "Install"
ja-JP = "インストール"
[navigation.contributors.values]
en-US = "Contributors"
ja-JP = "貢献者"
[navigation.license.values]
en-US = "License"
ja-JP = "ライセンス"
[setup.values]
en-US = "1. Install build tools"
ja-JP = "1. ビルドツールをインストールする"
[windows.values]
en-US = "Windows"
ja-JP = "Windows"
[windows_intro.values]
en-US = "Install Ubuntu through Windows Subsystem for Linux from PowerShell:"
ja-JP = "PowerShell から Windows Subsystem for Linux を使って Ubuntu をインストールします。"
[windows_note.values]
en-US = "Open Ubuntu after installation, then run the remaining commands inside the Ubuntu terminal, not PowerShell."
ja-JP = "インストール後に Ubuntu を開き、残りのコマンドは PowerShell ではなく Ubuntu のターミナルで実行してください。"
[macos.values]
en-US = "macOS"
ja-JP = "macOS"
[macos_intro.values]
en-US = "Install Apple's command-line tools, then install Flex with Homebrew:"
ja-JP = "Apple のコマンドラインツールをインストールしてから、Homebrew で Flex をインストールします。"
[linux.values]
en-US = "Linux"
ja-JP = "Linux"
[linux_intro.values]
en-US = "Install GCC, Make, and Flex for your distribution:"
ja-JP = "使用するディストリビューション向けに GCC、Make、Flex をインストールします。"
[source.values]
en-US = "2. Download a release"
ja-JP = "2. リリースをダウンロードする"
[source_intro.values]
en-US = "Run the following commands in the directory where you want to keep the source. They download and extract the newest release:"
ja-JP = "ソースを保存するディレクトリで次のコマンドを実行します。最新のリリースをダウンロードして展開します。"
[source_custom.values]
en-US = "Do not fork, branch from, or open pull requests against `main`; it is generated from `source`."
ja-JP = "`main` は `source` から生成されます。`main` をフォーク、ブランチ作成元、またはプルリクエストの対象にしないでください。"
[curl_intro.values]
en-US = "Or download the current `main` source archive with curl into `~/src`:"
ja-JP = "または、curl で現在の `main` ソースアーカイブを `~/src` にダウンロードします。"
[curl_custom.values]
en-US = "For a custom curl location, download and extract there instead:"
ja-JP = "curl の保存先を指定する場合は、そこでダウンロードして展開してください。"
[curl_note.values]
en-US = "There is no `curl | sh` installer or prebuilt release package. The curl command downloads the same source that Git clones."
ja-JP = "`curl | sh` インストーラやビルド済みリリースパッケージはありません。curl コマンドは Git がクローンするものと同じソースをダウンロードします。"
[install.values]
en-US = "3. Build and install"
ja-JP = "3. ビルドしてインストールする"
[install_intro.values]
en-US = "Run these commands from the `src/` directory created in the previous step. `~/.local/bin` is the recommended per-user installation directory."
ja-JP = "前の手順で作成した `src/` ディレクトリで次のコマンドを実行します。ユーザーごとの推奨インストール先は `~/.local/bin` です。"
[path_note.values]
en-US = "Add the installation directory to your shell path if your system does not already include `~/.local/bin`, then verify the installation:"
ja-JP = "システムの PATH に `~/.local/bin` が含まれていない場合は、インストール先をシェルの PATH に追加してから、インストールを確認します。"
[assembler.values]
en-US = "`make install` installs the bundled assembler at `~/.local/bin/lc3as`. The following command should print paths for both installed tools:"
ja-JP = "`make install` は同梱のアセンブラを `~/.local/bin/lc3as` にインストールします。次のコマンドは、インストールされた両方のツールのパスを表示するはずです。"
[release_note.values]
en-US = "Distribution packages (for example, APT and pacman) are not available yet."
ja-JP = "APT や pacman などの配布パッケージはまだ提供していません。"

[credits.values]
en-US = "Credits"
ja-JP = "謝辞"
[credits_text.values]
en-US = "LCC was created by Christopher W. Fraser and David R. Hanson. The LC-3 target was developed by Ajay Ladsaria and Sanjay J. Patel, with later work by Sean Smith, Stephen Canon, and Avery Yen. This fork is maintained by Kooraseru."
ja-JP = "LCC は Christopher W. Fraser と David R. Hanson によって作成されました。LC-3 ターゲットは Ajay Ladsaria と Sanjay J. Patel が開発し、その後 Sean Smith、Stephen Canon、Avery Yen が作業を行いました。このフォークは Kooraseru が保守しています。"
[contributors.values]
en-US = "Contributors"
ja-JP = "貢献者"
[contributors_text.values]
en-US = "Contributions are welcome. Read the contribution guide before opening an issue or pull request."
ja-JP = "貢献を歓迎します。Issue やプルリクエストを作成する前に、貢献ガイドを確認してください。"

[title.values]
en-US = "LCC-LC3 C Compiler"
ja-JP = "LCC-LC3 C コンパイラ"
[summary.values]
en-US = "LCC-LC3 is an LC-3 target for the LCC C compiler. Build it from source on a Unix shell. Windows users should use WSL."
ja-JP = "LCC-LC3 は LCC C コンパイラ用の LC-3 ターゲットです。Unix シェルでソースからビルドします。Windows では WSL を使用してください。"

[setup.values]
en-US = "1. Set Up Unix"
ja-JP = "1. Unix をセットアップする"
[windows.values]
en-US = "Windows"
ja-JP = "Windows"
[windows_intro.values]
en-US = "Install Ubuntu through Windows Subsystem for Linux from PowerShell:"
ja-JP = "PowerShell から Windows Subsystem for Linux を使って Ubuntu をインストールします。"
[windows_note.values]
en-US = "Open Ubuntu after installation, then run the remaining commands inside the Ubuntu terminal, not PowerShell."
ja-JP = "インストール後に Ubuntu を開き、残りのコマンドは PowerShell ではなく Ubuntu のターミナルで実行してください。"
[macos.values]
en-US = "macOS"
ja-JP = "macOS"
[macos_intro.values]
en-US = "Install Apple's command-line tools:"
ja-JP = "Apple のコマンドラインツールをインストールします。"
[linux.values]
en-US = "Linux"
ja-JP = "Linux"
[linux_intro.values]
en-US = "Install a C compiler, Make, and download tools for your distribution."
ja-JP = "使用するディストリビューション向けに C コンパイラ、Make、ダウンロードツールをインストールします。"
[source.values]
en-US = "Get LCC-LC3"
ja-JP = "LCC-LC3 を入手する"
[source_intro.values]
en-US = "When a release archive is available, download and extract it from the [Releases page](https://github.com/Kooraseru/lcc-lc3/releases), then follow `src/README.md`. To develop, contribute, or obtain the current source, clone the canonical `source` branch:"
ja-JP = "リリースアーカイブが利用できる場合は、[Releases ページ](https://github.com/Kooraseru/lcc-lc3/releases)からダウンロードして展開し、`src/README.md` に従ってください。開発、貢献、または最新ソースの取得には、正規の `source` ブランチをクローンします。"
[source_custom.values]
en-US = "Do not fork, branch from, or open pull requests against `main`; it is generated from `source`."
ja-JP = "`main` は `source` から生成されます。`main` をフォーク、ブランチ作成元、またはプルリクエストの対象にしないでください。"
[curl_intro.values]
en-US = "Or download the current `main` source archive with curl into `~/src`:"
ja-JP = "または、curl で現在の `main` ソースアーカイブを `~/src` にダウンロードします。"
[curl_custom.values]
en-US = "For a custom curl location, download and extract there instead:"
ja-JP = "curl の保存先を指定する場合は、そこでダウンロードして展開してください。"
[curl_note.values]
en-US = "There is no `curl | sh` installer or prebuilt release package. The curl command downloads the same source that Git clones."
ja-JP = "`curl | sh` インストーラやビルド済みリリースパッケージはありません。curl コマンドは Git がクローンするものと同じソースをダウンロードします。"
[install.values]
en-US = "Build and install"
ja-JP = "ビルドしてインストールする"
[install_intro.values]
en-US = "Run these commands from the release archive's `src/` directory or the development checkout's `code/` directory. GCC, Make, and Flex are required. `~/.local/bin` is the recommended per-user location for executable tools."
ja-JP = "リリースアーカイブの `src/` ディレクトリ、または開発チェックアウトの `code/` ディレクトリで次のコマンドを実行します。GCC、Make、Flex が必要です。実行可能ツールのユーザーごとの推奨配置先は `~/.local/bin` です。"
[path_note.values]
en-US = "Add the installation directory to your shell path if your system does not already include `~/.local/bin`:"
ja-JP = "システムの PATH に `~/.local/bin` が含まれていない場合は、インストール先をシェルの PATH に追加します。"
[assembler.values]
en-US = "`make install` also installs the bundled `lc3as` assembler at `~/.local/bin/lc3as`."
ja-JP = "`make install` は、同梱の `lc3as` アセンブラも `~/.local/bin/lc3as` にインストールします。"
[release_note.values]
en-US = "Release archives are intended to contain only this buildable tree as `src/` and its setup README. Distribution packages (for example, APT and pacman) are not available yet."
ja-JP = "リリースアーカイブには、ビルド可能なツリーを `src/` とセットアップ README として含めます。APT や pacman などの配布パッケージはまだ提供していません。"

[credits.values]
en-US = "Credits"
ja-JP = "謝辞"
[credits_text.values]
en-US = "LCC was created by Christopher W. Fraser and David R. Hanson. The LC-3 target was developed by Ajay Ladsaria and Sanjay J. Patel, with later work by Sean Smith, Stephen Canon, and Avery Yen. This fork is maintained by Kooraseru."
ja-JP = "LCC は Christopher W. Fraser と David R. Hanson によって作成されました。LC-3 ターゲットは Ajay Ladsaria と Sanjay J. Patel が開発し、その後 Sean Smith、Stephen Canon、Avery Yen が作業を行いました。このフォークは Kooraseru が保守しています。"
